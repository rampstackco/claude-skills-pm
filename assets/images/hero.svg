<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280" width="800" height="280">
  <!-- Background -->
  <rect width="800" height="280" fill="#0f172a" rx="12"/>

  <!-- Grid pattern -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="280" fill="url(#grid)" opacity="0.6"/>

  <!-- Headline -->
  <text x="400" y="95" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-weight="700" font-size="42" fill="#f1f5f9">Claude Skills PM</text>

  <!-- Tagline -->
  <text x="400" y="135" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-weight="400" font-size="18" fill="#94a3b8">12 product management skills for Claude Code</text>

  <!-- 5 phase badges, centered. 5 * 110 + 4 * 12 = 598. Left margin = (800-598)/2 = 101 -->
  <g transform="translate(101, 185)">
    <!-- Discovery: blue -->
    <rect x="0" y="0" width="110" height="28" rx="14" fill="#1e40af" opacity="0.3"/>
    <text x="55" y="18" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#93c5fd" font-weight="500">Discovery &#183; 2</text>

    <!-- Planning: purple -->
    <rect x="122" y="0" width="110" height="28" rx="14" fill="#7c3aed" opacity="0.3"/>
    <text x="177" y="18" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#c4b5fd" font-weight="500">Planning &#183; 3</text>

    <!-- Execution: orange -->
    <rect x="244" y="0" width="110" height="28" rx="14" fill="#ea580c" opacity="0.3"/>
    <text x="299" y="18" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#fdba74" font-weight="500">Execution &#183; 3</text>

    <!-- Launch: red -->
    <rect x="366" y="0" width="110" height="28" rx="14" fill="#dc2626" opacity="0.3"/>
    <text x="421" y="18" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#fca5a5" font-weight="500">Launch &#183; 2</text>

    <!-- Measure: green -->
    <rect x="488" y="0" width="110" height="28" rx="14" fill="#059669" opacity="0.3"/>
    <text x="543" y="18" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#6ee7b7" font-weight="500">Measure &#183; 2</text>
  </g>

  <!-- Subtitle -->
  <text x="400" y="245" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#64748b" font-weight="400">Curated subset of claude-skills &#183; standalone, no MCP required</text>
</svg>
